name: Allure Report

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: allure-pages
  cancel-in-progress: true

on:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        id: unit-tests-run
        run: bun run test:coverage
        continue-on-error: true

      - name: Upload unit test Allure results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: allure-results-unit
          path: allure-results/
          retention-days: 30

      - name: Fail if unit tests failed
        if: ${{ steps.unit-tests-run.outcome == 'failure' }}
        run: exit 1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      STRIPE_API_SECRET_KEY: ${{ secrets.STRIPE_API_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CLERK_ADMIN_IDS: ${{ secrets.CLERK_ADMIN_IDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps

      - name: Run Playwright tests
        id: playwright-tests
        run: bunx playwright test
        continue-on-error: true

      - name: Upload E2E Allure results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: allure-results-e2e
          path: allure-results/
          retention-days: 30

      - name: Fail if Playwright tests failed
        if: ${{ steps.playwright-tests.outcome == 'failure' }}
        run: exit 1

  generate-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: ${{ always() && !cancelled() }}

    steps:
      - name: Download unit test Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-unit
          path: allure-results/unit
        continue-on-error: true

      - name: Download E2E Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-e2e
          path: allure-results/e2e
        continue-on-error: true

      - name: Check for results
        id: check
        run: |
          count=$(find allure-results -name '*.json' -o -name '*.xml' 2>/dev/null | wc -l)
          echo "result_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No Allure result files found. Skipping report generation."
          else
            echo "Found $count result files."
          fi

      - name: Merge results into single directory
        if: steps.check.outputs.result_count != '0'
        run: |
          mkdir -p allure-results/merged
          cp -r allure-results/unit/* allure-results/merged/ 2>/dev/null || true
          cp -r allure-results/e2e/* allure-results/merged/ 2>/dev/null || true
          echo "Merged result files:"
          ls -la allure-results/merged/ | head -20

      - name: Find previous workflow run for history
        if: steps.check.outputs.result_count != '0'
        id: prev-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the most recent completed run of this workflow (excluding current)
          prev_run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/allure-report.yml/runs?status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id // empty")
          if [ -n "$prev_run_id" ]; then
            echo "run_id=$prev_run_id" >> "$GITHUB_OUTPUT"
            echo "Found previous run: $prev_run_id"
          else
            echo "No previous run found."
          fi

      - name: Download previous report for history
        if: steps.check.outputs.result_count != '0' && steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: allure-report-history
          path: allure-history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev-run.outputs.run_id }}
        continue-on-error: true

      - name: Copy history into results
        if: steps.check.outputs.result_count != '0'
        run: |
          if [ -d allure-history/history ]; then
            cp -r allure-history/history allure-results/merged/history
            echo "Copied previous history for trend data."
          else
            echo "No previous history found. First run."
          fi

      - name: Setup Java
        if: steps.check.outputs.result_count != '0'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Allure CLI
        if: steps.check.outputs.result_count != '0'
        run: |
          ALLURE_VERSION=2.32.0
          wget -q "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf "allure-${ALLURE_VERSION}.tgz"
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        if: steps.check.outputs.result_count != '0'
        run: allure generate allure-results/merged --clean -o allure-report

      - name: Upload report history for future runs
        if: steps.check.outputs.result_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-history
          path: allure-report/history/
          retention-days: 90

      - name: Setup GitHub Pages
        if: steps.check.outputs.result_count != '0'
        uses: actions/configure-pages@v6

      - name: Upload report to Pages
        if: steps.check.outputs.result_count != '0'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.result_count != '0'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Print report URL
        if: steps.check.outputs.result_count != '0'
        run: echo "Allure report deployed to ${{ steps.deployment.outputs.page_url }}"
