name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        id: typecheck
        shell: bash
        run: set -o pipefail && bunx tsc --noEmit 2>&1 | tee tsc-output.txt
        continue-on-error: true

      - name: Comment on PR if typecheck failed
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-typecheck -->';
            let output = fs.readFileSync('tsc-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(0, 60000) + '\n... (truncated)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## TypeScript Check Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'There are type errors that need to be fixed before this PR can be merged.',
              '',
              '<details>',
              '<summary>TypeScript errors (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bunx tsc --noEmit` locally to see all errors and fix them.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if typecheck passed
        if: steps.typecheck.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-typecheck -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale typecheck failure comment');
            }

      - name: Fail if typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        id: lint
        shell: bash
        run: set -o pipefail && bun run lint 2>&1 | tee lint-output.txt
        continue-on-error: true

      - name: Comment on PR if lint failed
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-lint -->';
            let output = fs.readFileSync('lint-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(0, 60000) + '\n... (truncated)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## ESLint Check Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'There are linting errors that need to be fixed before this PR can be merged.',
              '',
              '<details>',
              '<summary>ESLint errors (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run lint` locally to see all errors. Many can be auto-fixed with `bun run lint --fix`.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if lint passed
        if: steps.lint.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-lint -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale lint failure comment');
            }

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

  build:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      STRIPE_API_SECRET_KEY: ${{ secrets.STRIPE_API_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CLERK_ADMIN_IDS: ${{ secrets.CLERK_ADMIN_IDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        id: build
        shell: bash
        run: set -o pipefail && bun run build 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Comment on PR if build failed
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-build -->';
            let output = fs.readFileSync('build-output.txt', 'utf8').trim();
            if (output.length > 60000) output = '... (truncated)\n' + output.slice(-60000);
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## Build Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'The Next.js build failed. Please fix the errors below before this PR can be merged.',
              '',
              '<details>',
              '<summary>Build output (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run build` locally to reproduce and fix the errors.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if build passed
        if: steps.build.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-build -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale build failure comment');
            }

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        id: unit-test
        shell: bash
        run: set -o pipefail && bun run test:coverage 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Comment on PR if unit tests failed
        if: steps.unit-test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-unit-test -->';
            let output = fs.readFileSync('test-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(-60000) + '\n... (truncated from start)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## Unit Tests Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'Unit tests are failing. Please fix the errors below before this PR can be merged.',
              '',
              '<details>',
              '<summary>Test output (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run test` locally to reproduce and fix the failing tests.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if unit tests passed
        if: steps.unit-test.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-unit-test -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale unit test failure comment');
            }

      - name: Fail if unit tests failed
        if: steps.unit-test.outcome == 'failure'
        run: exit 1
