name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        id: typecheck
        shell: bash
        run: set -o pipefail && bunx tsc --noEmit 2>&1 | tee tsc-output.txt
        continue-on-error: true

      - name: Comment on PR if typecheck failed
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-typecheck -->';
            let output = fs.readFileSync('tsc-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(0, 60000) + '\n... (truncated)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## TypeScript Check Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'There are type errors that need to be fixed before this PR can be merged.',
              '',
              '<details>',
              '<summary>TypeScript errors (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bunx tsc --noEmit` locally to see all errors and fix them.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if typecheck passed
        if: steps.typecheck.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-typecheck -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale typecheck failure comment');
            }

      - name: Fail if typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        id: lint
        shell: bash
        run: set -o pipefail && bun run lint 2>&1 | tee lint-output.txt
        continue-on-error: true

      - name: Comment on PR if lint failed
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-lint -->';
            let output = fs.readFileSync('lint-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(0, 60000) + '\n... (truncated)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## ESLint Check Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'There are linting errors that need to be fixed before this PR can be merged.',
              '',
              '<details>',
              '<summary>ESLint errors (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run lint` locally to see all errors. Many can be auto-fixed with `bun run lint --fix`.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if lint passed
        if: steps.lint.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-lint -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale lint failure comment');
            }

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

  build:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      STRIPE_API_SECRET_KEY: ${{ secrets.STRIPE_API_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CLERK_ADMIN_IDS: ${{ secrets.CLERK_ADMIN_IDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        id: build
        shell: bash
        run: set -o pipefail && bun run build 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Comment on PR if build failed
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-build -->';
            let output = fs.readFileSync('build-output.txt', 'utf8').trim();
            if (output.length > 60000) output = '... (truncated)\n' + output.slice(-60000);
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## Build Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'The Next.js build failed. Please fix the errors below before this PR can be merged.',
              '',
              '<details>',
              '<summary>Build output (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run build` locally to reproduce and fix the errors.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if build passed
        if: steps.build.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-build -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale build failure comment');
            }

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        id: unit-test
        shell: bash
        run: set -o pipefail && bun run test:coverage 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Determine test vs coverage failure
        id: coverage-check
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.unit-test.outcome }}" = "success" ]; then
            # Tests passed and coverage thresholds met (Vitest enforces thresholds via config)
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
            echo "coverage_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Command failed — determine whether tests failed, coverage failed, or both
          coverage_failed=false
          tests_failed=false

          if grep -q "does not meet global threshold" test-output.txt 2>/dev/null; then
            coverage_failed=true
          fi

          # Check for Vitest test failure markers (e.g. "Tests  2 failed | 10 passed")
          if grep -Eq '(^|[[:space:]])FAIL([[:space:]]|$)|^[[:space:]]*(Test Files|Tests)[[:space:]].*[1-9][0-9]* failed' test-output.txt 2>/dev/null; then
            tests_failed=true
          fi

          if [ "$tests_failed" = "true" ]; then
            # Tests themselves failed (with or without an additional coverage failure)
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "coverage_ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$coverage_failed" = "true" ]; then
            # Tests passed but coverage thresholds were not met
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
            echo "coverage_ok=false" >> "$GITHUB_OUTPUT"
          else
            # Unknown failure (e.g. config error, missing dependencies)
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "coverage_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unit test Allure results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-unit
          path: allure-results/
          retention-days: 30

      - name: Comment on PR if unit tests failed
        if: steps.coverage-check.outputs.tests_passed == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-unit-test -->';
            let output = fs.readFileSync('test-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(-60000) + '\n... (truncated from start)';
            output = output.replace(/```/g, '` ` `');

            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              '## Unit Tests Failed',
              '',
              `Commit: \`${sha}\``,
              '',
              'Unit tests are failing. Please fix the errors below before this PR can be merged.',
              '',
              '<details>',
              '<summary>Test output (click to expand)</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bun run test` locally to reproduce and fix the failing tests.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Comment on PR if coverage is not 100%
        if: steps.coverage-check.outputs.tests_passed == 'true' && steps.coverage-check.outputs.coverage_ok == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-unit-test -->';
            let output = fs.readFileSync('test-output.txt', 'utf8').trim();
            if (output.length > 60000) output = output.slice(-60000) + '\n... (truncated from start)';
            output = output.replace(/```/g, '` ` `');

            // Extract test summary (Test Files, Tests, Start at, Duration lines)
            const testSummaryLines = output.match(/Test Files .+|Tests {2}.+|Start at .+|Duration .+/g) || [];
            const testSummary = testSummaryLines.join('\n');

            // Extract coverage table (from "% Coverage report" to the closing dashes line)
            const coverageMatch = output.match(/% Coverage report[\s\S]*?-{10,}\s*$/m);
            let coverageTable = coverageMatch ? coverageMatch[0] : 'Coverage report not found';
            if (coverageTable.length > 50000) coverageTable = coverageTable.slice(0, 50000) + '\n... (truncated)';

            // Find files that are not at 100%
            const lines = output.split('\n');
            const uncoveredFiles = lines.filter(line => {
              // Match coverage table data rows (not header/separator)
              if (!line.includes('|') || line.includes('% Stmts') || line.match(/^[\s-|]+$/)) return false;
              if (line.includes('All files')) return false;
              // Check if any percentage is not 100
              const parts = line.split('|').map(p => p.trim());
              return parts.slice(1, 5).some(p => p !== '100' && p !== '' && !isNaN(p));
            });

            const sha = context.sha.slice(0, 7);
            const bodyParts = [
              marker,
              '## Unit Test Coverage Below 100%',
              '',
              `Commit: \`${sha}\``,
              '',
              'All tests passed, but code coverage is not at **100%**. Please add tests to cover all code paths.',
              '',
              '### Test Results',
              '```',
              testSummary,
              '```',
              '',
              '### Coverage Report',
              '<details>',
              '<summary>Full coverage report from v8 (click to expand)</summary>',
              '',
              '```',
              coverageTable,
              '```',
              '',
              '</details>',
            ];

            if (uncoveredFiles.length > 0) {
              bodyParts.push('');
              bodyParts.push('### Files Below 100% Coverage');
              bodyParts.push('');
              bodyParts.push('| File | % Stmts | % Branch | % Funcs | % Lines | Uncovered Lines |');
              bodyParts.push('|------|---------|----------|---------|---------|-----------------|');
              for (const line of uncoveredFiles) {
                const parts = line.split('|').map(p => p.trim());
                bodyParts.push(`| ${parts[0]} | ${parts[1]} | ${parts[2]} | ${parts[3]} | ${parts[4]} | ${parts[5] || ''} |`);
              }
            }

            bodyParts.push('');
            bodyParts.push('**Target: 100% coverage across Statements, Branches, Functions, and Lines.**');
            bodyParts.push('');
            bodyParts.push('**How to fix:** Run `bun run test:coverage` locally to see the full coverage report and add missing tests.');

            const body = bodyParts.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Delete comment if unit tests and coverage passed
        if: steps.coverage-check.outputs.tests_passed == 'true' && steps.coverage-check.outputs.coverage_ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-unit-test -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale unit test/coverage failure comment');
            }

      - name: Fail if unit tests failed
        if: steps.coverage-check.outputs.tests_passed == 'false'
        run: exit 1

      - name: Fail if coverage is not 100%
        if: steps.coverage-check.outputs.tests_passed == 'true' && steps.coverage-check.outputs.coverage_ok == 'false'
        run: |
          echo "::error::Code coverage is not at 100%. Please add tests to cover all code paths."
          echo "Run 'bun run test:coverage' locally to see the full coverage report."
          exit 1
