name: Sync Lockfiles

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"

jobs:
  sync-lockfiles:
    name: Sync package-lock.json and bun.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check if triggered by bot commit
        id: check_bot
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const isBot = commit.author?.login === 'speakify-bot[bot]';
            core.setOutput('is_bot', isBot.toString());
            if (isBot) console.log('Skipping: triggered by bot commit');

      - name: Generate GitHub App token
        if: steps.check_bot.outputs.is_bot != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Update bun.lock
        if: steps.check_bot.outputs.is_bot != 'true'
        run: bun install

      - name: Update package-lock.json
        if: steps.check_bot.outputs.is_bot != 'true'
        run: npm install --package-lock-only

      - name: Check if lockfiles changed
        if: steps.check_bot.outputs.is_bot != 'true'
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain -- bun.lock package-lock.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lockfiles
        if: steps.check_bot.outputs.is_bot != 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "speakify-bot[bot]@users.noreply.github.com"
          git config --local user.name "speakify-bot[bot]"
          git add bun.lock package-lock.json
          git commit -m "chore: sync lockfiles with package.json"
          git push
