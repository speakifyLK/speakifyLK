name: Sync Lockfiles

on:
  push:
    branches-ignore: [main]
    paths:
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "package.json"

jobs:
  sync-lockfiles:
    name: Sync package-lock.json and bun.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check if triggered by bot commit
        id: check_bot
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            const isBot = commit.author?.login === 'speakify-bot[bot]';
            core.setOutput('is_bot', isBot.toString());
            if (isBot) console.log('Skipping: triggered by bot commit');

      - name: Generate GitHub App token
        if: steps.check_bot.outputs.is_bot != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout branch
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Update bun.lock
        if: steps.check_bot.outputs.is_bot != 'true'
        run: bun install 2>&1 | tee bun-install-output.txt

      - name: Update package-lock.json
        if: steps.check_bot.outputs.is_bot != 'true'
        run: npm install --package-lock-only 2>&1 | tee npm-install-output.txt

      - name: Check if lockfiles changed
        if: steps.check_bot.outputs.is_bot != 'true'
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain -- bun.lock package-lock.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lockfiles
        if: steps.check_bot.outputs.is_bot != 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "speakify-bot[bot]@users.noreply.github.com"
          git config --local user.name "speakify-bot[bot]"
          git add bun.lock package-lock.json
          git commit -m "chore: sync lockfiles with package.json"
          git pull --rebase
          git push 2>&1 | tee sync-push-output.txt

      - name: Comment on PR if sync failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let bunLog = '';
            let npmLog = '';
            let pushLog = '';
            try { bunLog = fs.readFileSync('bun-install-output.txt', 'utf8').trim(); } catch {}
            try { npmLog = fs.readFileSync('npm-install-output.txt', 'utf8').trim(); } catch {}
            try { pushLog = fs.readFileSync('sync-push-output.txt', 'utf8').trim(); } catch {}
            let logs = [bunLog, npmLog, pushLog].filter(Boolean).join('\n\n');
            if (logs.length > 3000) logs = '... (truncated)\n' + logs.slice(-3000);
            const body = [
              '## Lockfile Sync Failed',
              '',
              'The automatic lockfile sync workflow failed.',
              '',
              'This may be caused by:',
              '- Conflicting dependency versions in `package.json`',
              '- A rebase conflict when pushing the updated lockfiles',
              '',
              '<details>',
              '<summary>Failure logs (click to expand)</summary>',
              '',
              '```',
              logs,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:**',
              '1. Run `bun install` and `npm install --package-lock-only` locally',
              '2. Commit the updated `bun.lock` and `package-lock.json`',
              '',
              'Check the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
