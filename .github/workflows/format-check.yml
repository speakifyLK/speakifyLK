name: Auto-Format Code

on:
  pull_request:
    branches: [main]

jobs:
  format-code:
    name: Format with Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skip for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Skipping format check for Dependabot PR"
          exit 0

      - name: Checkout PR branch
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: npm ci

      - name: Format changed files with Prettier
        if: github.actor != 'dependabot[bot]'
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|css|scss|md|yml|yaml)$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Formatting files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs npx prettier --write --config config/prettier.json --ignore-unknown
          else
            echo "No files to format"
          fi

      - name: Check if files were modified
        if: github.actor != 'dependabot[bot]'
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit formatted code
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "style: auto-format code with Prettier"
          git push
