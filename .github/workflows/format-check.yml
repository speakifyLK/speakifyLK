name: Auto-Format Code

on:
  pull_request:
    branches: [main]

jobs:
  format-code:
    name: Format with Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check if triggered by bot commit
        id: check_bot
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const isBot = commit.author?.login === 'github-actions[bot]';
            core.setOutput('is_bot', isBot.toString());
            if (isBot) console.log('Skipping: triggered by bot commit');

      - name: Generate GitHub App token
        if: steps.check_bot.outputs.is_bot != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.check_bot.outputs.is_bot != 'true'
        run: npm ci

      - name: Format changed files with Prettier
        if: steps.check_bot.outputs.is_bot != 'true'
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|css|scss|md|yml|yaml)$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Formatting files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs npx prettier --write --config config/prettier.json --ignore-unknown
          else
            echo "No files to format"
          fi

      - name: Check if files were modified
        if: steps.check_bot.outputs.is_bot != 'true'
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit formatted code
        if: steps.check_bot.outputs.is_bot != 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "style: auto-format code with Prettier"
          git push
