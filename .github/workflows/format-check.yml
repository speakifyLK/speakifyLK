name: Auto-Format Code

on:
  pull_request:
    branches: [main]

jobs:
  format-code:
    name: Format with Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check if triggered by bot commit
        id: check_bot
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const isBot = commit.author?.login === 'speakify-bot[bot]';
            core.setOutput('is_bot', isBot.toString());
            if (isBot) console.log('Skipping: triggered by bot commit');

      - name: Generate GitHub App token
        if: steps.check_bot.outputs.is_bot != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        if: steps.check_bot.outputs.is_bot != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.check_bot.outputs.is_bot != 'true'
        run: bun install --frozen-lockfile

      - name: Format changed files with Prettier
        id: format
        if: steps.check_bot.outputs.is_bot != 'true'
        shell: bash
        run: |
          set -o pipefail
          # Get list of changed files
          CHANGED_FILES=$(git diff --diff-filter=d --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|css|scss|md|yml|yaml)$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Formatting files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs bunx prettier --write --config config/prettier.json --ignore-unknown
          else
            echo "No files to format"
          fi 2>&1 | tee format-output.txt

      - name: Check if files were modified
        if: steps.check_bot.outputs.is_bot != 'true'
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit formatted code
        id: commit
        if: steps.check_bot.outputs.is_bot != 'true' && steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -o pipefail
          git config --local user.email "speakify-bot[bot]@users.noreply.github.com"
          git config --local user.name "speakify-bot[bot]"
          git add .
          git commit -m "style: auto-format code with Prettier"
          git pull --rebase
          git push 2>&1 | tee commit-output.txt

      - name: Delete comment if formatting succeeded
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- format-check-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale format failure comment');
            }

      - name: Comment on PR if formatting failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let formatLog = '';
            let commitLog = '';
            try { formatLog = fs.readFileSync('format-output.txt', 'utf8').trim(); } catch {}
            try { commitLog = fs.readFileSync('commit-output.txt', 'utf8').trim(); } catch {}
            let logs = [formatLog, commitLog].filter(Boolean).join('\n\n');
            if (logs.length > 3000) logs = '... (truncated)\n' + logs.slice(-3000);
            logs = logs.replace(/```/g, '` ` `');

            const marker = '<!-- format-check-comment -->';
            const body = [
              marker,
              '## Auto-Format Failed',
              '',
              'The Prettier auto-format workflow encountered an error and could not complete.',
              '',
              'This may be caused by:',
              '- A syntax error preventing Prettier from parsing a file',
              '- A conflict when pushing the formatted commit',
              '',
              '<details>',
              '<summary>Failure logs (click to expand)</summary>',
              '',
              '```',
              logs,
              '```',
              '',
              '</details>',
              '',
              '**How to fix:** Run `bunx prettier --write --config config/prettier.json .` locally and commit the changes.',
              '',
              'Check the [workflow logs](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
