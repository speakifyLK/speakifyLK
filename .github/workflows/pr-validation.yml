name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Check PR requirements
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'copilot-swe-agent[bot]'
    steps:
      - name: Auto-assign PR author if unassigned
        if: github.event.pull_request.assignees == null || toJSON(github.event.pull_request.assignees) == '[]'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login]
            });
            console.log('Auto-assigned PR to author: ' + context.payload.pull_request.user.login);

      - name: Validate Jira key in PR title
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const jiraPattern = /^[A-Z][A-Z0-9]+-\d+:\s.+/;

            if (!jiraPattern.test(title)) {
              core.setFailed('PR title must follow the format: SPEAKLK-123: short description\nExample: SPEAKLK-24: Add Zustand store for quiz state');
            } else {
              const jiraKey = title.match(/[A-Z][A-Z0-9]+-\d+/)[0];
              console.log(`PR title references Jira issue: ${jiraKey}`);
            }
