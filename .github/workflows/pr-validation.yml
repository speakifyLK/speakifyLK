name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Check PR requirements
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Auto-assign PR author if unassigned
        if: github.event.pull_request.assignees == null || toJSON(github.event.pull_request.assignees) == '[]'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login]
            });
            console.log('Auto-assigned PR to author: ' + context.payload.pull_request.user.login);

      - name: Validate Jira key in PR title
        id: validate_title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const jiraPattern = /^[A-Z][A-Z0-9]+-\d+:\s.+/;

            if (!jiraPattern.test(title)) {
              core.setOutput('valid', 'false');
              core.setFailed('PR title must follow the format: SPEAKLK-123: short description');
            } else {
              core.setOutput('valid', 'true');
              const jiraKey = title.match(/[A-Z][A-Z0-9]+-\d+/)[0];
              console.log('PR title references Jira issue: ' + jiraKey);
            }

      - name: Delete comment if title is valid
        if: steps.validate_title.outputs.valid == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-title-validation-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
              console.log('Deleted stale PR title validation comment');
            }

      - name: Comment on PR if title invalid
        if: failure() && steps.validate_title.outputs.valid == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const safeTitle = title.replace(/`/g, "'").replace(/[<>]/g, '');

            const marker = '<!-- pr-title-validation-comment -->';
            const body = [
              marker,
              '## Invalid PR Title',
              '',
              'Your PR title does not match the required format.',
              '',
              '**Current title:** `' + safeTitle + '`',
              '',
              '**Required format:** `SPEAKLK-123: short description`',
              '',
              '**Example:** `SPEAKLK-24: Add Zustand store for quiz state`',
              '',
              'Please edit the PR title to include a valid Jira issue key.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
