name: Jira Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  sync-with-jira:
    name: Sync PR with Jira
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff stats
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}

          # Get list of changed files
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get diff stats (insertions/deletions per file)
          STATS=$(git diff --stat origin/${{ github.base_ref }}...HEAD)
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sync PR with Jira
        uses: actions/github-script@v7
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_KEY }}
          JIRA_BASE_URL: 'https://speakifylk.atlassian.net'
          JIRA_EMAIL: 'desilvabethmin@gmail.com'
          PR_FILES: ${{ steps.diff.outputs.files }}
          PR_STATS: ${{ steps.diff.outputs.stats }}
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            const prNumber = context.issue.number;
            const prFiles = process.env.PR_FILES || '';
            const prStats = process.env.PR_STATS || '';

            console.log('=== Starting Jira-GitHub Integration ===');

            // Check if PR already has matching Jira title and description
            const jiraTitleMatch = title.match(/^([A-Z][A-Z0-9]+-\d+):/);
            const jiraReferenceSection = /##\s*Jira Reference/i;

            if (jiraTitleMatch && jiraReferenceSection.test(body)) {
              // Only skip if the Jira key in title matches the one in the body
              const titleKey = jiraTitleMatch[1];
              const bodyKeyMatch = body.match(/[A-Z][A-Z0-9]+-\d+/);
              if (bodyKeyMatch && bodyKeyMatch[0] === titleKey) {
                console.log(`PR already synced with ${titleKey}, skipping update`);
                return;
              }
              console.log(`Jira key changed (body has ${bodyKeyMatch?.[0]}, title has ${titleKey}), re-syncing...`);
            }

            // Extract issue references (Fixes #123, Closes #456, etc.)
            const issueKeywords = ['fixes', 'closes', 'resolves', 'fix', 'close', 'resolve'];
            const issuePattern = new RegExp(`(${issueKeywords.join('|')})\\s+#(\\d+)`, 'gi');
            const issueMatches = [...body.matchAll(issuePattern)];

            // Extract direct Jira references
            const jiraPattern = /[A-Z][A-Z0-9]+-\d+/g;
            let jiraKeys = [...new Set((title + ' ' + body).match(jiraPattern) || [])];

            console.log(`Found ${issueMatches.length} GitHub issue references`);
            console.log(`Found ${jiraKeys.length} direct Jira references`);

            // Fetch linked GitHub issues to extract Jira references
            let linkedIssues = [];
            for (const match of issueMatches) {
              const issueNumber = match[2];
              console.log(`Fetching GitHub issue #${issueNumber}...`);

              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNumber)
                });

                linkedIssues.push({
                  number: issueNumber,
                  title: issue.title,
                  body: issue.body || ''
                });

                // Extract Jira key from issue title or body
                const issueJiraKeys = (issue.title + ' ' + issue.body).match(jiraPattern) || [];
                jiraKeys = [...new Set([...jiraKeys, ...issueJiraKeys])];
                console.log(`Found Jira keys in issue #${issueNumber}: ${issueJiraKeys.join(', ')}`);
              } catch (error) {
                console.error(`Failed to fetch issue #${issueNumber}: ${error.message}`);
              }
            }

            if (jiraKeys.length === 0) {
              console.log('No Jira reference found, skipping Jira integration');
              return;
            }

            console.log(`Processing Jira keys: ${jiraKeys.join(', ')}`);

            // Fetch Jira issue details
            const jiraToken = process.env.JIRA_API_TOKEN;
            const jiraEmail = process.env.JIRA_EMAIL;
            const jiraBaseUrl = process.env.JIRA_BASE_URL;

            if (!jiraToken) {
              console.log('JIRA_API_TOKEN not configured, skipping Jira integration');
              return;
            }

            const authHeader = Buffer.from(`${jiraEmail}:${jiraToken}`).toString('base64');

            // Fetch details for all Jira issues
            let jiraIssues = [];
            for (const jiraKey of jiraKeys) {
              console.log(`Fetching Jira details for ${jiraKey}...`);

              try {
                const jiraResponse = await fetch(`${jiraBaseUrl}/rest/api/3/issue/${jiraKey}`, {
                  headers: {
                    'Authorization': `Basic ${authHeader}`,
                    'Accept': 'application/json'
                  }
                });

                if (!jiraResponse.ok) {
                  throw new Error(`Jira API returned ${jiraResponse.status}`);
                }

                const jiraIssue = await jiraResponse.json();

                // Extract description text from ADF format
                let description = 'No description';
                if (jiraIssue.fields.description?.content) {
                  const textParts = [];
                  const extractText = (node) => {
                    if (node.type === 'text' && node.text) {
                      textParts.push(node.text);
                    }
                    if (node.content) {
                      node.content.forEach(extractText);
                    }
                  };
                  jiraIssue.fields.description.content.forEach(extractText);
                  description = textParts.join(' ').trim();
                }

                jiraIssues.push({
                  key: jiraKey,
                  summary: jiraIssue.fields.summary,
                  description: description,
                  status: jiraIssue.fields.status.name,
                  type: jiraIssue.fields.issuetype.name,
                  url: `${jiraBaseUrl}/browse/${jiraKey}`
                });

                console.log(`Fetched ${jiraKey}: ${jiraIssue.fields.summary}`);
              } catch (error) {
                console.error(`Failed to fetch ${jiraKey}: ${error.message}`);
              }
            }

            if (jiraIssues.length === 0) {
              core.setFailed('Failed to fetch Jira details');
              return;
            }

            const primaryJira = jiraIssues[0];

            // Build PR title and description from Jira + diff metadata
            console.log('Generating PR content from Jira + diff metadata...');

            // Determine action verb from Jira issue type
            const typeVerb = {
              'Story': 'Implement',
              'Bug': 'Fix',
              'Task': 'Add',
              'Sub-task': 'Add',
              'Epic': 'Implement'
            };
            const verb = typeVerb[primaryJira.type] || 'Update';
            const generatedTitle = `${primaryJira.key}: ${verb} ${primaryJira.summary}`.substring(0, 72);

            // Parse changed files into categories
            const fileList = prFiles.split('\n').filter(f => f.trim());
            const filesByDir = {};
            for (const file of fileList) {
              const dir = file.includes('/') ? file.split('/').slice(0, 2).join('/') : '.';
              if (!filesByDir[dir]) filesByDir[dir] = [];
              filesByDir[dir].push(file.split('/').pop());
            }

            // Build changes list from file categories
            const changeLines = Object.entries(filesByDir)
              .slice(0, 8)
              .map(([dir, files]) => {
                if (files.length <= 2) {
                  return files.map(f => `- Modified \`${dir}/${f}\``).join('\n');
                }
                return `- Updated ${files.length} files in \`${dir}/\``;
              })
              .join('\n');

            let generatedDescription = `## Description\n${primaryJira.summary}\n\n`;
            generatedDescription += `## Jira Reference\n- Issue: [${primaryJira.key}](${primaryJira.url})\n- Type: ${primaryJira.type}\n- Status: ${primaryJira.status}\n\n`;

            if (primaryJira.description && primaryJira.description !== 'No description') {
              generatedDescription += `## Task Details\n${primaryJira.description}\n\n`;
            }

            if (linkedIssues.length > 0) {
              generatedDescription += `## Related Issues\nFixes #${linkedIssues[0].number}\n`;
            }

            // Update PR title and description
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              title: generatedTitle,
              body: generatedDescription
            });

            console.log('Updated PR title and description');

            // Add jira-linked label
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'jira-linked',
                color: '0366d6',
                description: 'PR is linked to a Jira issue'
              });
            } catch (error) {
              // Label exists
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['jira-linked']
            });

            // Add comment to Jira issue linking the PR
            console.log('Adding PR link to Jira issue...');
            try {
              const prUrl = context.payload.pull_request.html_url;
              const prAuthor = context.payload.pull_request.user.login;

              const jiraComment = {
                body: {
                  version: 1,
                  type: 'doc',
                  content: [
                    {
                      type: 'paragraph',
                      content: [
                        {
                          type: 'text',
                          text: 'GitHub Pull Request',
                          marks: [{ type: 'strong' }]
                        }
                      ]
                    },
                    {
                      type: 'paragraph',
                      content: [
                        {
                          type: 'text',
                          text: `PR #${prNumber}: `,
                          marks: []
                        },
                        {
                          type: 'text',
                          text: generatedTitle,
                          marks: [{ type: 'link', attrs: { href: prUrl } }]
                        }
                      ]
                    },
                    {
                      type: 'paragraph',
                      content: [
                        {
                          type: 'text',
                          text: `Author: @${prAuthor}`,
                          marks: []
                        }
                      ]
                    },
                    {
                      type: 'paragraph',
                      content: [
                        {
                          type: 'text',
                          text: `Status: ${context.payload.pull_request.state}`,
                          marks: []
                        }
                      ]
                    }
                  ]
                }
              };

              const jiraCommentResponse = await fetch(`${jiraBaseUrl}/rest/api/3/issue/${primaryJira.key}/comment`, {
                method: 'POST',
                headers: {
                  'Authorization': `Basic ${authHeader}`,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(jiraComment)
              });

              if (jiraCommentResponse.ok) {
                console.log(`Added PR link to Jira issue ${primaryJira.key}`);
              } else {
                const errorText = await jiraCommentResponse.text();
                console.error(`Failed to add Jira comment: ${jiraCommentResponse.status} - ${errorText}`);
              }
            } catch (error) {
              console.error(`Error adding Jira comment: ${error.message}`);
            }

            console.log('Jira integration complete');

  validate-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check commits for Jira references
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const jiraPattern = /[A-Z][A-Z0-9]+-\d+/;
            const invalidCommits = [];

            for (const commit of commits) {
              const message = commit.commit.message;
              const firstLine = message.split('\n')[0];

              // Skip merge commits
              if (firstLine.startsWith('Merge ')) {
                continue;
              }

              if (!jiraPattern.test(firstLine)) {
                invalidCommits.push(`❌ \`${commit.sha.substring(0, 7)}\`: ${firstLine.substring(0, 60)}...`);
              }
            }

            if (invalidCommits.length > 0) {
              console.log(`Found ${invalidCommits.length} commits without Jira references`);
            }
